name: Daily Insider Check

on:
  schedule:
    - cron: '0 9 * * 1-5'  # Weekdays at 9 AM UTC
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated list of stock tickers (leave blank to use repo variable or default)'
        required: false
        default: ''
      threshold:
        description: 'Minimum trade size in USD (leave blank for default)'
        required: false
        default: ''
      lookback:
        description: 'Days to search back for a valid SEC master index'
        required: false
        default: ''

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
  # Priority: dispatch input > repository variable > hardcoded fallback
  TICKERS: ${{ github.event.inputs.tickers || vars.TICKERS || 'AAPL,GOOGL' }}
  THRESHOLD_USD: ${{ github.event.inputs.threshold || vars.THRESHOLD_USD || '500000' }}
  LOOKBACK_DAYS: ${{ github.event.inputs.lookback || vars.LOOKBACK_DAYS || '1' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run bot
        run: mvn compile exec:java -Dexec.args="${{ env.TICKERS }} --threshold=${{ env.THRESHOLD_USD }} --lookback=${{ env.LOOKBACK_DAYS }}"