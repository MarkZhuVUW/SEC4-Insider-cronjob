# .github/workflows/daily-check.yml
#
# Two scheduled runs (04:00 & 16:00 Auckland) + manual dispatch.
#
# Repository config:
#   Variables (Settings → Secrets and variables → Actions → Variables tab):
#     TICKERS    e.g. AAPL,MSFT,NVDA
#     THRESHOLD  e.g. 500000
#     LOOKBACK   e.g. 1
#   Secrets:
#     DISCORD_WEBHOOK_URL  Discord webhook URL
#     PAT                  Personal Access Token with `Variables: read & write`
#                          (only needed if you want to update vars from the UI)
#
# Manual run:
#   - update_vars unchecked  → values you type are used ONLY for this run.
#                              Blank inputs fall back to the saved variable.
#   - update_vars checked    → saved variables are overwritten with your inputs
#                              (blank input keeps the existing variable value),
#                              then the check runs with the new values.
#                              Requires PAT secret.

name: Daily Insider Check

on:
  schedule:
    - cron: '0 16 * * *'   # 04:00 NZST (Auckland) — UTC 16:00
    - cron: '0 4 * * *'    # 16:00 NZST (Auckland) — UTC 04:00
  workflow_dispatch:
    inputs:
      update_vars:
        description: 'Save inputs as repository variables before running (requires PAT). If unchecked, inputs are used for this run only.'
        type: boolean
        default: false
      tickers:
        description: 'Tickers (comma-separated). Blank = keep existing TICKERS variable.'
        required: false
        default: ''
      threshold:
        description: 'USD threshold. Blank = keep existing THRESHOLD variable.'
        required: false
        default: ''
      lookback:
        description: 'Lookback days. Blank = keep existing LOOKBACK variable.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: optionally update repository variables. Skipped on schedule, and
  # skipped on manual dispatch when update_vars=false.
  # ---------------------------------------------------------------------------
  update-vars:
    if: github.event_name == 'workflow_dispatch' && inputs.update_vars == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT }}
    steps:
      - name: Validate PAT
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::update_vars=true but PAT secret is not set."
            exit 1
          fi

      - name: Update TICKERS variable
        if: inputs.tickers != ''
        run: |
          echo "Updating TICKERS variable"
          printf '%s' "${{ inputs.tickers }}" | gh variable set TICKERS --repo "$GITHUB_REPOSITORY" --body -

      - name: Update THRESHOLD variable
        if: inputs.threshold != ''
        run: |
          echo "Updating THRESHOLD variable"
          printf '%s' "${{ inputs.threshold }}" | gh variable set THRESHOLD --repo "$GITHUB_REPOSITORY" --body -

      - name: Update LOOKBACK variable
        if: inputs.lookback != ''
        run: |
          echo "Updating LOOKBACK variable"
          printf '%s' "${{ inputs.lookback }}" | gh variable set LOOKBACK --repo "$GITHUB_REPOSITORY" --body -

      - name: Summary
        run: echo "Variable update step complete."

  # ---------------------------------------------------------------------------
  # Job 2: actual insider check. Runs after update-vars (or directly when
  # update-vars is skipped). Re-reads vars context so freshly updated values
  # are picked up.
  # ---------------------------------------------------------------------------
  check:
    needs: [update-vars]
    if: |
      always() &&
      (needs.update-vars.result == 'success' || needs.update-vars.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve effective parameters
        id: params
        env:
          EVENT_NAME:        ${{ github.event_name }}
          UPDATE_VARS:       ${{ inputs.update_vars }}
          INPUT_TICKERS:     ${{ inputs.tickers }}
          INPUT_THRESHOLD:   ${{ inputs.threshold }}
          INPUT_LOOKBACK:    ${{ inputs.lookback }}
          VAR_TICKERS:       ${{ vars.TICKERS }}
          VAR_THRESHOLD:     ${{ vars.THRESHOLD }}
          VAR_LOOKBACK:      ${{ vars.LOOKBACK }}
        run: |
          # Rule:
          #   - schedule run            → always use repo variables
          #   - dispatch + update_vars  → variables were just rewritten, use them
          #   - dispatch + no update    → input wins; blank input falls back to variable
          if [ "$EVENT_NAME" = "schedule" ] || [ "$UPDATE_VARS" = "true" ]; then
            T="$VAR_TICKERS"; H="$VAR_THRESHOLD"; L="$VAR_LOOKBACK"
          else
            T="${INPUT_TICKERS:-$VAR_TICKERS}"
            H="${INPUT_THRESHOLD:-$VAR_THRESHOLD}"
            L="${INPUT_LOOKBACK:-$VAR_LOOKBACK}"
          fi
          echo "tickers=$T"   >> "$GITHUB_OUTPUT"
          echo "threshold=$H" >> "$GITHUB_OUTPUT"
          echo "lookback=$L"  >> "$GITHUB_OUTPUT"
          echo "Effective config: tickers=$T threshold=$H lookback=$L"

      - name: Build
        run: mvn -B -ntp package -DskipTests

      - name: Run insider check
        env:
          TICKERS:             ${{ steps.params.outputs.tickers }}
          THRESHOLD_USD:       ${{ steps.params.outputs.threshold }}
          LOOKBACK_DAYS:       ${{ steps.params.outputs.lookback }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEBUG:               'true'
        run: mvn -B -ntp exec:java
