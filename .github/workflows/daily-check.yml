name: Daily Insider Check

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Pacific/Auckland"

  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated list of stock tickers"
        required: false
        default: "NVDA,AMZN,AAPL,GOOGL,SOFI,TEAM,CROX,V,STZ,DVA,OXY,CRM,SIEGY,DPZ,TRI,EL,DIS,WDFC,AXP,WM,ELV,MOH,KO,LVMUY,COST,PDD,MCO,RKLB"

      threshold:
        description: "Minimum trade size in USD"
        required: false
        default: "200000"

      lookback:
        description: "Days to search back for a valid SEC master index"
        required: false
        default: "7"

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}

  # Manual run overrides default values
  TICKERS: ${{ github.event.inputs.tickers || 'NVDA,AMZN,AAPL,GOOGL,SOFI,TEAM,CROX,V,STZ,DVA,OXY,CRM,SIEGY,DPZ,TRI,EL,DIS,WDFC,AXP,WM,ELV,MOH,KO,LVMUY,COST,PDD,MCO,RKLB' }}

  THRESHOLD_USD: ${{ github.event.inputs.threshold || '200000' }}

  LOOKBACK_DAYS: ${{ github.event.inputs.lookback || '7' }}